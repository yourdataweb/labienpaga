<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="presentation">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#3a1f2b"/><stop offset="0.5" stop-color="#6b3746"/>
      <stop offset="0.85" stop-color="#c98a63"/><stop offset="1" stop-color="#e3b98a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a34"/><stop offset="1" stop-color="#2a1220"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- far facades -->
  <g fill="#4a2733" opacity="0.85">
    <rect x="0" y="380" width="260" height="330"/>
    <rect x="250" y="410" width="210" height="300"/>
    <rect x="1100" y="395" width="230" height="315"/>
    <rect x="1320" y="365" width="280" height="345"/>
  </g>
  <!-- awnings -->
  <g>
    <path d="M250 470 h210 l-16 44 h-178 Z" fill="#a8481f" opacity="0.9"/>
    <path d="M1100 455 h230 l-18 46 h-194 Z" fill="#c99a3f" opacity="0.85"/>
    <g fill="#f9efe4" opacity="0.55">
      <rect x="262" y="476" width="34" height="30"/><rect x="330" y="476" width="34" height="30"/><rect x="398" y="476" width="34" height="30"/>
    </g>
  </g>
  <!-- windows -->
  <g fill="#f3c98d" opacity="0.55">
    <rect x="60" y="450" width="46" height="60"/><rect x="150" y="450" width="46" height="60"/>
    <rect x="300" y="540" width="40" height="52"/><rect x="380" y="540" width="40" height="52"/>
    <rect x="1160" y="520" width="44" height="56"/><rect x="1240" y="520" width="44" height="56"/>
    <rect x="1380" y="470" width="48" height="62"/><rect x="1470" y="470" width="48" height="62"/>
  </g>
  <!-- string lights over the square -->
  <g stroke="#ffd9a0" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M0 210 C 300 300 620 320 820 250 C 1040 175 1340 190 1600 240"/>
    <path d="M0 330 C 340 410 700 425 940 350 C 1180 275 1400 300 1600 350"/>
  </g>
  <g fill="#ffe6b8">
    <circle cx="120" cy="245" r="5"/><circle cx="300" cy="292" r="5"/><circle cx="490" cy="312" r="5"/>
    <circle cx="690" cy="308" r="5"/><circle cx="900" cy="272" r="5"/><circle cx="1120" cy="228" r="5"/>
    <circle cx="1330" cy="222" r="5"/><circle cx="1500" cy="238" r="5"/>
    <circle cx="200" cy="372" r="5"/><circle cx="470" cy="404" r="5"/><circle cx="760" cy="406" r="5"/>
    <circle cx="1040" cy="360" r="5"/><circle cx="1300" cy="326" r="5"/>
  </g>
  <!-- glow -->
  <circle cx="800" cy="560" r="330" fill="url(#lamp)" filter="url(#soft)"/>
  <!-- plaza floor -->
  <path d="M0 1000 V710 H1600 V1000 Z" fill="url(#floor)"/>
  <g stroke="#c9a98a" stroke-opacity="0.18" stroke-width="2">
    <path d="M0 790 H1600"/><path d="M0 870 H1600"/><path d="M0 950 H1600"/>
    <path d="M240 710 V1000"/><path d="M560 710 V1000"/><path d="M880 710 V1000"/><path d="M1200 710 V1000"/>
  </g>
  <!-- terrace tables -->
  <g fill="#2a1220" opacity="0.92">
    <g transform="translate(300 760)">
      <ellipse cx="0" cy="0" rx="88" ry="26"/><rect x="-5" y="0" width="10" height="70"/>
      <rect x="-46" y="66" width="92" height="8" rx="4"/>
    </g>
    <g transform="translate(800 810) scale(1.15)">
      <ellipse cx="0" cy="0" rx="88" ry="26"/><rect x="-5" y="0" width="10" height="70"/>
      <rect x="-46" y="66" width="92" height="8" rx="4"/>
    </g>
    <g transform="translate(1290 770) scale(0.95)">
      <ellipse cx="0" cy="0" rx="88" ry="26"/><rect x="-5" y="0" width="10" height="70"/>
      <rect x="-46" y="66" width="92" height="8" rx="4"/>
    </g>
  </g>
  <!-- chairs -->
  <g stroke="#2a1220" stroke-width="7" fill="none" opacity="0.85">
    <path d="M180 830 v70 M180 830 h34"/><path d="M400 838 v66 M400 838 h-34"/>
    <path d="M690 876 v72 M690 876 h36"/><path d="M915 882 v68 M915 882 h-36"/>
  </g>
</svg>
